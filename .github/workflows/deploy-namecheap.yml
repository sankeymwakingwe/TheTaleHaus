name: Deploy The Tale Haus to Namecheap

# Uploads the site to the Namecheap (cPanel) server over FTPS on every push to
# main. It stays switched off until these repository secrets exist
# (Settings → Secrets and variables → Actions):
#   FTP_SERVER    e.g. ftp.thetale.haus
#   FTP_USERNAME  the cPanel FTP account
#   FTP_PASSWORD  its password
on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: namecheap
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Skip until FTP details are set
        if: env.FTP_SERVER == ''
        run: echo "FTP_SERVER secret not set yet; nothing to deploy."

      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''

      - name: Upload to public_html
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            CNAME
            .nojekyll
            private/**
