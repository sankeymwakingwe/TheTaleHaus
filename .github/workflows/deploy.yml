name: Deploy site to GitHub Pages

on:
  push:
    branches: ["claude/personal-website-build-x6mzml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish only the site itself, not the README or workflow files.
      - name: Collect site files
        run: |
          mkdir _site
          cp -r *.html assets images .nojekyll _site/
          # Stamp each deploy's version on the CSS/JS links so browsers never use a stale copy.
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" _site/*.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
