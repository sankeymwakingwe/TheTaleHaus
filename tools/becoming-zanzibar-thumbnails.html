<title>Becoming Zanzibar Thumbnails</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
/* Layout: editor rail on the left, live 1:1-export canvas on the right; stacks with the preview first on phones. */
:root {
  --bg: #f3f1ee;
  --panel: #ffffff;
  --fg: #1b1916;
  --muted: #6d675f;
  --line: #ddd8d1;
  --accent: #d9a521;      /* the yellow dot on the guest pill */
  --accent-ink: #1b1916;
  --stage: #e7e3dd;
  --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans: "Plus Jakarta Sans", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12110f; --panel: #1b1a17; --fg: #f1ede6; --muted: #a29b90;
    --line: #34312c; --accent: #e8b931; --accent-ink: #12110f; --stage: #0b0a09;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12110f; --panel: #1b1a17; --fg: #f1ede6; --muted: #a29b90;
  --line: #34312c; --accent: #e8b931; --accent-ink: #12110f; --stage: #0b0a09;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 48px; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
h1 { font-family: var(--display); font-weight: 500; font-size: 2rem; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 span { color: var(--muted); }
header p { margin: 0; color: var(--muted); max-width: 52ch; line-height: 1.5; }

.app { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 820px) { .app { grid-template-columns: minmax(0, 1fr); } .stage { order: -1; } }

.rail { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 18px; min-width: 0; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 10px; min-width: 0; }
legend { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0; margin-bottom: 10px; }
label { display: grid; gap: 5px; font-weight: 600; font-size: 13px; }
label small { font-weight: 500; color: var(--muted); }
input[type=text], textarea { width: 100%; font: inherit; font-weight: 500; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
textarea { resize: vertical; min-height: 64px; line-height: 1.4; }
input[type=text]:focus-visible, textarea:focus-visible, button:focus-visible, input[type=range]:focus-visible, input[type=checkbox]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { font: inherit; font-weight: 600; font-size: 12.5px; background: transparent; color: var(--fg); border: 0; padding: 9px 4px; cursor: pointer; line-height: 1.25; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button small { display: block; font-weight: 500; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.seg button[aria-pressed="true"] small { color: inherit; opacity: .7; }

.btn { font: inherit; font-weight: 700; border-radius: 9px; padding: 11px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .55; cursor: default; }
.actions { display: grid; gap: 8px; }
.status { min-height: 1.2em; color: var(--muted); font-size: 12.5px; margin: 0; }

.stage { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); background: var(--stage); border-radius: 12px; padding: 20px; display: grid; place-items: center; min-width: 0; }
.stage canvas { display: block; max-width: 100%; max-height: calc(100vh - 140px); width: auto; height: auto; border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.stage.drag { outline: 2px dashed var(--accent); outline-offset: -8px; }
.hint { margin: 12px 0 0; color: var(--muted); font-size: 12.5px; text-align: center; }
@media (max-width: 820px) { .stage { position: static; } .stage canvas { max-height: 70vh; } }
</style>

<div class="wrap">
  <header>
    <h1>Becoming Zanzibar <span>thumbnails</span></h1>
    <p>Drop in a frame from the episode, type the pull quote, and save the cover. The layout matches the quote poster on the grid.</p>
  </header>

  <div class="app">
    <form class="rail" id="form" autocomplete="off">
      <fieldset>
        <legend>Size</legend>
        <div class="seg" role="group" aria-label="Size">
          <button type="button" data-fmt="post" aria-pressed="true">Post<small>1080 × 1350</small></button>
          <button type="button" data-fmt="reel" aria-pressed="false">Reel cover<small>1080 × 1920</small></button>
          <button type="button" data-fmt="yt" aria-pressed="false">YouTube<small>1280 × 720</small></button>
        </div>
      </fieldset>

      <fieldset>
        <legend>Photo</legend>
        <label>Episode frame <small>Or drag a photo onto the preview, or paste one.</small>
          <input type="file" id="photo" accept="image/*">
        </label>
        <label>Zoom <input type="range" id="zoom" min="0.4" max="2.5" step="0.01" value="1"></label>
        <div class="row">
          <label>Left / right <input type="range" id="offX" min="-0.5" max="0.5" step="0.005" value="0"></label>
          <label>Up / down <input type="range" id="offY" min="-0.5" max="0.5" step="0.005" value="0"></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Guest</legend>
        <label>Name <input type="text" id="name" value="Ella Naiman"></label>
        <label>Role <input type="text" id="role" value="Head of Sales, CPS Africa"></label>
        <label class="check"><input type="checkbox" id="showPill" checked> Show name tag</label>
      </fieldset>

      <fieldset>
        <legend>Words</legend>
        <label>Quote <small>Press Enter to force a line break.</small>
          <textarea id="quote" rows="2">Zanzibar is where Bali was 10 years ago.</textarea>
        </label>
        <label class="check"><input type="checkbox" id="curly" checked> Wrap in quote marks</label>
        <label>Quote size <input type="range" id="qSize" min="0.7" max="1.35" step="0.01" value="1"></label>
        <label>Supporting line
          <textarea id="sub" rows="2">We don’t even have enough beds for the tourists that come here.</textarea>
        </label>
      </fieldset>

      <fieldset>
        <legend>Footer</legend>
        <label>Left text
          <textarea id="foot" rows="2">Watch the full episode on YouTube
@BecomingZanzibar</textarea>
        </label>
        <label class="check"><input type="checkbox" id="showLink" checked> Show “Link on Bio” tag</label>
        <label>Logo <small>Built in by default. Upload a transparent PNG to use your own file.</small>
          <input type="file" id="logo" accept="image/png,image/svg+xml,image/webp">
        </label>
      </fieldset>

      <div class="actions">
        <button type="button" class="btn primary" id="save">Save PNG</button>
        <button type="button" class="btn" id="saveAll">Save all three sizes</button>
        <p class="status" id="status" role="status"></p>
      </div>
    </form>

    <div class="stage" id="stage">
      <canvas id="cv" width="1080" height="1350" aria-label="Thumbnail preview"></canvas>
      <p class="hint" id="hint">Example frame from the Ella Naiman episode. Replace it with your own.</p>
    </div>
  </div>
</div>

    }
  } catch (e) {}
  function remember() {
    try {
      const o = { fmt };
      fields.forEach((k) => { const el = $(k); o[k] = el.type === "checkbox" ? el.checked : el.value; });
      localStorage.setItem("bz-thumb", JSON.stringify(o));
    } catch (e) {}
  }

  function loadImage(src) {
    return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  }
  function readFile(file) {
    return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  }

  // ---------- drawing helpers ----------
  function setFont(c, weight, size, family, tracking) {
    c.font = `${weight} ${size}px ${family}`;
    if ("letterSpacing" in c) c.letterSpacing = `${(tracking || 0) * size}px`;
  }
  function wrap(c, text, maxW) {
    const out = [];
    text.split(/\n/).forEach((para) => {
      const words = para.trim().split(/\s+/).filter(Boolean);
      if (!words.length) return;
      // Greedy wrap, then narrow the measure while the line count holds so lines come out balanced.
      const greedy = (w) => {
        const lines = []; let cur = "";
        words.forEach((wd) => {
          const t = cur ? cur + " " + wd : wd;
          if (c.measureText(t).width <= w || !cur) cur = t; else { lines.push(cur); cur = wd; }
        });
        if (cur) lines.push(cur);
        return lines;
      };
      let best = greedy(maxW);
      for (let w = maxW - 8; w > maxW * 0.5; w -= 8) {
        const l = greedy(w);
        if (l.length > best.length || l.some((s) => c.measureText(s).width > maxW)) break;
        best = l;
      }
      out.push(...best);
    });
    return out;
  }
  function rrect(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  function drawPhoto(c, W, H, o) {
    c.fillStyle = INK; c.fillRect(0, 0, W, H);
    if (!photo) return;
    const s = Math.max(W / photo.width, H / photo.height) * o.zoom;
    const dw = photo.width * s, dh = photo.height * s;
    c.drawImage(photo, (W - dw) / 2 + o.offX * W, (H - dh) / 2 + o.offY * H, dw, dh);
  }

  function drawShade(c, W, H, wide) {
    let g = c.createLinearGradient(0, 0, 0, H * 0.22);
    g.addColorStop(0, "rgba(0,0,0,.38)"); g.addColorStop(1, "rgba(0,0,0,0)");
    c.fillStyle = g; c.fillRect(0, 0, W, H * 0.22);
    if (wide) {
      g = c.createLinearGradient(0, 0, W, 0);
      g.addColorStop(0, "rgba(11,10,9,.94)"); g.addColorStop(0.42, "rgba(11,10,9,.78)"); g.addColorStop(0.72, "rgba(11,10,9,0)");
      c.fillStyle = g; c.fillRect(0, 0, W, H);
      g = c.createLinearGradient(0, H * 0.55, 0, H);
      g.addColorStop(0, "rgba(11,10,9,0)"); g.addColorStop(1, "rgba(11,10,9,.85)");
      c.fillStyle = g; c.fillRect(0, H * 0.55, W, H * 0.45);
    } else {
      g = c.createLinearGradient(0, H * 0.4, 0, H);
      g.addColorStop(0, "rgba(11,10,9,0)"); g.addColorStop(0.28, "rgba(11,10,9,.6)");
      g.addColorStop(0.5, "rgba(11,10,9,.95)"); g.addColorStop(0.58, "rgba(11,10,9,1)"); g.addColorStop(1, "rgba(11,10,9,1)");
      c.fillStyle = g; c.fillRect(0, H * 0.4, W, H * 0.6);
    }
  }

  function drawLogo(c, x, y, h) {
    // h = height of the stacked wordmark; matches the "BZ | Becoming Zanzibar" lockup.
    if (logoImg) { const w = logoImg.width * (h * 1.15) / logoImg.height; c.drawImage(logoImg, x, y - h * 0.08, w, h * 1.15); return; }
    c.save();
    c.fillStyle = "rgba(255,255,255,.92)"; c.textBaseline = "alphabetic"; c.textAlign = "left";
    const zS = h * 0.95, bS = h * 0.55, base = y + h * 0.82;
    setFont(c, 400, bS, SERIF, 0); c.fillText("B", x, base - zS * 0.02);
    const bw = c.measureText("B").width;
    setFont(c, 400, zS, SERIF, 0); c.fillText("Z", x + bw * 0.9, base);
    const zx = x + bw * 0.9 + c.measureText("Z").width + h * 0.18;
    c.fillRect(zx, y - h * 0.08, Math.max(1.5, h * 0.025), h * 1.12);
    const tS = h * 0.5, tx = zx + h * 0.2;
    setFont(c, 400, tS, SERIF, -0.01);
    c.fillText("Becoming", tx, y + tS * 0.82);
    c.fillText("Zanzibar", tx, y + tS * 0.82 + tS * 0.86);
    c.restore();
  }

  function pillSize(c, S, name, role) {
    setFont(c, 700, S.name, SANS, -0.02); const nw = c.measureText(name).width + S.name * 0.75;
    setFont(c, 600, S.role, SANS, 0); const rw = c.measureText(role).width;
    const w = Math.max(nw, rw) + S.name * 2.2, h = S.name * (role ? 2.95 : 2.1);
    return { w, h };
  }
  function drawPill(c, S, x, y, w, h, name, role, align) {
    c.save();
    rrect(c, x, y, w, h, S.name * 0.42);
    c.fillStyle = "rgba(30,24,19,.62)"; c.fill();
    c.lineWidth = Math.max(1.5, S.name * 0.06); c.strokeStyle = "rgba(255,255,255,.3)"; c.stroke();
    c.textBaseline = "alphabetic";
    setFont(c, 700, S.name, SANS, -0.02);
    const nw = c.measureText(name).width, dotR = S.name * 0.17, gap = S.name * 0.42;
    const total = nw + dotR * 2 + gap;
    const nx = align === "left" ? x + S.name * 1.1 : x + (w - total) / 2;
    const nBase = role ? y + S.name * 1.45 : y + h / 2 + S.name * 0.36;
    c.fillStyle = DOT; c.beginPath(); c.arc(nx + dotR, nBase - S.name * 0.34, dotR, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#fff"; c.textAlign = "left"; c.fillText(name, nx + dotR * 2 + gap, nBase);
    if (role) {
      setFont(c, 600, S.role, SANS, 0); c.fillStyle = "rgba(255,255,255,.72)";
      if (align === "left") c.fillText(role, nx, nBase + S.role * 1.7);
      else { c.textAlign = "center"; c.fillText(role, x + w / 2, nBase + S.role * 1.7); }
    }
    c.restore();
  }

  function drawLinkTag(c, right, baseY, size) {
    c.save();
    setFont(c, 700, size, SANS, -0.01);
    const label = "Link on Bio", tw = c.measureText(label).width;
    const ic = size * 0.95, padX = size * 0.75, h = size * 2.05, w = padX * 2 + ic + size * 0.4 + tw;
    const x = right - w, y = baseY - h;
    rrect(c, x, y, w, h, h / 2); c.fillStyle = "#fff"; c.fill();
    // chain-link glyph: two rounded links at 45°
    c.translate(x + padX + ic / 2, y + h / 2); c.rotate(-Math.PI / 4);
    c.strokeStyle = INK; c.lineWidth = size * 0.13; c.lineCap = "round";
    const lw = ic * 0.62, lh = ic * 0.34;
    rrect(c, -lw + lh * 0.55, -lh / 2, lw, lh, lh / 2); c.stroke();
    rrect(c, -lh * 0.55, -lh / 2, lw, lh, lh / 2); c.stroke();
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = INK; c.textBaseline = "middle"; c.textAlign = "left";
    c.fillText(label, x + padX + ic + size * 0.4, y + h / 2 + size * 0.04);
    c.restore();
  }

  function render(c, key) {
    const F = FORMATS[key], W = F.w, H = F.h, wide = key === "yt";
    const o = offsets[key];
    const name = $("name").value.trim(), role = $("role").value.trim();
    let quote = $("quote").value.trim();
    if (quote && $("curly").checked && !/^[“"]/.test(quote)) quote = "“" + quote.replace(/["”]$/, "") + "”";
    const sub = $("sub").value.trim(), foot = $("foot").value.trim();
    const q = parseFloat($("qSize").value);

    c.setTransform(1, 0, 0, 1, 0, 0); c.textAlign = "left"; c.textBaseline = "alphabetic";
    drawPhoto(c, W, H, o);
    drawShade(c, W, H, wide);

    const S = wide
      ? { margin: 64, logo: 50, quote: 64 * q, sub: 29, name: 22, role: 13.5, foot: 16, link: 15, maxW: W * 0.5 }
      : { margin: 76, logo: 54, quote: 74 * q, sub: 38, name: 26, role: 15.5, foot: 19, link: 17, maxW: W * 0.88 };
    const align = wide ? "left" : "center";
    const cx = wide ? S.margin : W / 2;

    drawLogo(c, S.margin, wide ? 48 : (key === "reel" ? 150 : 70), S.logo);

    // Footer (bottom-anchored). Reel covers keep clear of Instagram's own overlay.
    const footBase = H - (key === "reel" ? 260 : wide ? 40 : 74);
    c.textBaseline = "alphabetic";
    if (foot) {
      setFont(c, 600, S.foot, SANS, -0.01); c.fillStyle = "rgba(255,255,255,.9)"; c.textAlign = "left";
      const fl = foot.split(/\n/);
      fl.forEach((ln, i) => c.fillText(ln, S.margin, footBase - (fl.length - 1 - i) * S.foot * 1.3));
    }
    if ($("showLink").checked) drawLinkTag(c, W - S.margin, footBase + S.link * 0.55, S.link);

    // Text stack, built upward from the footer.
    c.fillStyle = "#fff"; c.textAlign = align;
    let y = footBase - (foot ? (foot.split(/\n/).length - 1) * S.foot * 1.3 : 0) - (wide ? 58 : 108);
    if (sub) {
      setFont(c, 700, S.sub, SANS, -0.03);
      const lines = wrap(c, sub, wide ? S.maxW : W * 0.74);
      for (let i = lines.length - 1; i >= 0; i--) { c.fillText(lines[i], cx, y); y -= S.sub * 1.18; }
      y -= S.sub * 0.35;
    }
    if (quote) {
      setFont(c, 800, S.quote, SANS, -0.035);
      const lines = wrap(c, quote, S.maxW);
      y -= S.quote * 0.08;
      for (let i = lines.length - 1; i >= 0; i--) { c.fillText(lines[i], cx, y); y -= S.quote * 1.04; }
      y -= S.quote * 0.15;
    }
    if ($("showPill").checked && name) {
      const p = pillSize(c, S, name, role);
      y -= S.name * 0.9;
      drawPill(c, S, wide ? S.margin : (W - p.w) / 2, y - p.h, p.w, p.h, name, role, align);
    }
  }

  function draw() {
    const F = FORMATS[fmt];
    if (cv.width !== F.w) cv.width = F.w;
    if (cv.height !== F.h) cv.height = F.h;
    render(ctx, fmt);
  }

  // ---------- controls ----------
  function syncSliders() { const o = offsets[fmt]; $("zoom").value = o.zoom; $("offX").value = o.offX; $("offY").value = o.offY; }
  document.querySelectorAll(".seg button").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.fmt === fmt));
    b.addEventListener("click", () => {
      fmt = b.dataset.fmt;
      document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      syncSliders(); draw(); remember();
    });
  });
  ["zoom", "offX", "offY"].forEach((k) => $(k).addEventListener("input", (e) => { offsets[fmt][k] = parseFloat(e.target.value); draw(); }));
  fields.forEach((k) => $(k).addEventListener("input", () => { draw(); remember(); }));
  $("form").addEventListener("submit", (e) => e.preventDefault());

  async function usePhoto(file) {
    if (!file || !file.type.startsWith("image/")) { status("That file isn’t an image. Use a JPG, PNG or WebP."); return; }
    try {
      photo = await loadImage(await readFile(file));
      usingSample = false; $("hint").hidden = true;
      fitOffsets(); syncSliders();
      draw(); status("");
    } catch (e) { status("Couldn’t open that image. Try exporting it as a JPG."); }
  }
  $("photo").addEventListener("change", (e) => usePhoto(e.target.files[0]));
  $("logo").addEventListener("change", async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try { logoImg = await loadImage(await readFile(f)); draw(); } catch (err) { status("Couldn’t open that logo file."); }
  });
  const stage = $("stage");
  stage.addEventListener("dragover", (e) => { e.preventDefault(); stage.classList.add("drag"); });
  stage.addEventListener("dragleave", () => stage.classList.remove("drag"));
  stage.addEventListener("drop", (e) => { e.preventDefault(); stage.classList.remove("drag"); usePhoto(e.dataTransfer.files[0]); });
  window.addEventListener("paste", (e) => {
    const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith("image/"));
    if (item) { e.preventDefault(); usePhoto(item.getAsFile()); }
  });

  // ---------- saving ----------
  function status(t) { $("status").textContent = t; }
  function slug() {
    const base = ($("name").value || "becoming-zanzibar").toLowerCase().normalize("NFKD").replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-");
    return "bz-" + (base || "thumbnail");
  }
  function toBlob(key) {
    const F = FORMATS[key], c = document.createElement("canvas");
    c.width = F.w; c.height = F.h; render(c.getContext("2d"), key);
    return new Promise((res) => c.toBlob(res, "image/png"));
  }
  let downloads;
  const dlReady = (window.claude && window.claude.use) ? window.claude.use("downloads").then((d) => (downloads = d)) : Promise.resolve(null);
  async function saveOne(key) {
    const blob = await toBlob(key), filename = `${slug()}-${FORMATS[key].label}.png`;
    await dlReady;
    if (downloads) {
      try { await downloads.save({ filename, data: blob }); return "saved"; }
      catch (e) {
        if (e && e.code === "declined") return "declined";
        if (e && e.code === "rate_limited") { status("A save prompt is already open. Finish it, then try again."); return "busy"; }
        status("Saving isn’t available in this view. Right-click or long-press the preview to save it."); return "error";
      }
    }
    if (window.claude) { status("Saving isn’t available in this view. Right-click or long-press the preview to save it."); return "error"; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    return "saved";
  }
  $("save").addEventListener("click", async () => {
    $("save").disabled = true; status("Preparing PNG…");
    const r = await saveOne(fmt);
    if (r === "saved") status("Saved."); else if (r === "declined") status("Save cancelled.");
    $("save").disabled = false;
  });
  $("saveAll").addEventListener("click", async () => {
    $("saveAll").disabled = true;
    let n = 0;
    for (const key of Object.keys(FORMATS)) {
      status(`Preparing ${FORMATS[key].label}…`);
      const r = await saveOne(key);
      if (r === "saved") n++; else if (r !== "declined") break;
    }
    status(n ? `Saved ${n} of 3.` : "Nothing saved.");
    $("saveAll").disabled = false;
  });

  // ---------- boot ----------
  syncSliders();
  Promise.all([
    loadImage(SAMPLE).then((i) => { if (usingSample) { photo = i; fitOffsets(); syncSliders(); } }),
    document.fonts.load(`800 74px ${SANS}`), document.fonts.load(`700 38px ${SANS}`),
    document.fonts.load(`600 19px ${SANS}`), document.fonts.load(`400 50px ${SERIF}`),
  ].map((p) => p.catch(() => {}))).then(draw);
  draw();
})();
</script>
